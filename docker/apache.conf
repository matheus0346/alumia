# Servidor HTTP de produção do container AlumIA (Apache + PHP). O Laravel é servido de public/.
# Escuta em porta não privilegiada e roda sem root.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Listen 8080

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nunca servir arquivos ocultos (.env, .git etc.) nem o conteúdo interno do framework.
    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
</VirtualHost>
