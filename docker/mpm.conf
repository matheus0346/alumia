# Poucos workers: com CPU muito limitada (ex.: Render Free, 0,1 CPU), muitos processos disputando a CPU
# deixam todas as requisições lentas. As demais ficam na fila do kernel até haver worker livre.
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    MaxRequestWorkers 10
    ListenBacklog 128
</IfModule>
