name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - name: Build isolated pilot and sync with Laravel
        run: npm run build
      - name: Build demonstration separately
        run: npm run build:demo

  backend:
    name: Backend SQLite and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alumia_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: alumia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U alumia_test -d alumia_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo_pgsql, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer audit --no-interaction
      - run: composer lint
      - name: SQLite tests
        run: composer test
      - name: Create isolated test schema
        run: psql -h 127.0.0.1 -U alumia_test -d alumia_test -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA alumia_testing'
        env:
          PGPASSWORD: test-only-password
      - name: PostgreSQL tests
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: alumia_test
          DB_USERNAME: alumia_test
          DB_PASSWORD: test-only-password
          DB_SCHEMA: alumia_testing
          DB_SSLMODE: disable

  required:
    name: CI required
    if: ${{ always() }}
    needs: [workflow-lint, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation to succeed
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          test "$WORKFLOW_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BACKEND_RESULT" = success
